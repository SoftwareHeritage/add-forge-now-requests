image:
  name: container-registry.softwareheritage.org/swh/infra/swh-apps/add_forge_now:20260629.2
  pull_policy: if-not-present

default:
  before_script:
    - export SWH_CONFIG_FILENAME="$SWH_CONFIG_FILENAME"
    - source .gitlab-ci/bash-functions.sh
    - curlrc
    - print_date Started
  tags:
    - AddForgeNowRequest
  after_script:
    - source .gitlab-ci/bash-functions.sh
    - register_this_job_as_last_job
    - print_date Completed
  artifacts:
    reports:
      dotenv:
        - last_job.env

variables:
  STAGING_AMQP_URL: http://scheduler0.internal.staging.swh.network:15672
  PRODUCTION_AMQP_URL: http://saatchi.internal.softwareheritage.org:15672
  GITLAB_URL: https://gitlab.softwareheritage.org
  WEBAPP_URL: https://archive.softwareheritage.org
  OIDC_URL: https://auth.softwareheritage.org/auth/
  OIDC_REALM: SoftwareHeritage
  STAGING_CONFIG_FILENAME: /etc/swh/scheduler-staging.yml
  PRODUCTION_CONFIG_FILENAME: /etc/swh/scheduler-production.yml
  LISTING_DELAY: 900
  PROJECT_ID: 474
  PROJECT_NAME: add-forge-now-requests
  MILESTONE_ID: 53
  INGESTION_SUCCESS_LIMIT: 30

workflow:
  name: 'processing AFNR#$REQUEST_ID $LISTER_TYPE $INSTANCE_NAME'
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"

# STAGES

stages:
  - pre_set_status
  - staging_list_origins
  - staging_ingest_origins
  - staging_set_status
  - production_list_origins
  - production_ingest_origins
  - production_set_status

# TEMPLATES

.artifacts:
  artifacts:
    untracked: true
    expire_in: 14 days
    reports:
      dotenv:
        - build.env
        - last_job.env

.on_success_status:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: on_success

.on_failure_status:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: on_failure

# JOBS

01_create_issue_and_register:
  stage: .pre
  script:
    - gitlab_create_issue
    - workaround_listers
    - register_vars pre
  extends:
    - .artifacts
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"

02_check_ports_and_token:
  stage: .pre
  script:
    - check_network_ports
    - webapp_check_token
  extends:
    - .on_success_status
  needs:
    - job: 01_create_issue_and_register

03_comment_request:
  stage: .pre
  script:
    - webapp_comment_and_status
  extends:
    - .on_success_status
  needs:
    - job: 01_create_issue_and_register
    - job: 02_check_ports_and_token

pre_status_successful:
  stage: pre_set_status
  script:
    - workaround_listers
    - register_vars staging
  extends:
    - .artifacts
    - .on_success_status
  needs:
    - job: 01_create_issue_and_register
    - job: 02_check_ports_and_token
    - job: 03_comment_request

pre_status_unsuccessful:
  stage: pre_set_status
  script:
    - gitlab_update_issue failure
  extends:
    - .on_failure_status
  needs:
    - job: 01_create_issue_and_register
    - job: 02_check_ports_and_token
    - job: 03_comment_request

1s_register_lister:
  stage: staging_list_origins
  script:
    - scheduler_register_lister
  extends:
    - .on_success_status
  needs:
    - job: pre_status_successful

2s_check_listed_origins:
  stage: staging_list_origins
  script:
    - scheduler_check_listed_origins
  extends:
    - .on_success_status
  needs:
    - job: pre_status_successful
    - job: 1s_register_lister

3s_schedule_first_visits:
  stage: staging_ingest_origins
  script:
    - scheduler_schedule_first_visits
  extends:
    - .on_success_status
  needs:
    - job: pre_status_successful
    - job: 2s_check_listed_origins

4s_check_ingested_origins:
  stage: staging_ingest_origins
  script:
    - scheduler_check_ingested_origins
  extends:
    - .on_success_status
  needs:
    - job: pre_status_successful
    - job: 3s_schedule_first_visits

staging_status_successful:
  stage: staging_set_status
  script:
    - webapp_comment_and_status SCHEDULED
    - gitlab_update_issue success
    - workaround_listers
    - register_vars production
  extends:
    - .artifacts
    - .on_success_status
  needs:
    - job: pre_status_successful
    - job: 4s_check_ingested_origins

staging_status_unsuccessful:
  stage: staging_set_status
  script:
    - gitlab_update_issue failure
  extends:
    - .on_failure_status
  needs:
    - job: pre_status_successful
    - job: 1s_register_lister
    - job: 2s_check_listed_origins
    - job: 3s_schedule_first_visits
    - job: 4s_check_ingested_origins

1p_register_lister:
  stage: production_list_origins
  script:
    - scheduler_register_lister
  extends:
    - .on_success_status
  needs:
    - job: staging_status_successful

2p_check_listed_origins:
  stage: production_list_origins
  script:
    - scheduler_check_listed_origins
  extends:
    - .on_success_status
  needs:
    - job: staging_status_successful
    - job: 1p_register_lister

3p_schedule_first_visits:
  stage: production_ingest_origins
  script:
    - scheduler_schedule_first_visits
  extends:
    - .on_success_status
  needs:
    - job: staging_status_successful
    - job: 2p_check_listed_origins

4p_check_ingested_origins:
  stage: production_ingest_origins
  script:
    - scheduler_check_ingested_origins
  extends:
    - .on_success_status
  needs:
    - job: staging_status_successful
    - job: 3p_schedule_first_visits

production_status_successful:
  stage: production_set_status
  script:
    - webapp_comment_and_status FIRST_ORIGIN_LOADED
    - gitlab_update_issue success
    - gitlab_close_issue
  extends:
    - .on_success_status
  needs:
    - job: staging_status_successful
    - job: 4p_check_ingested_origins

production_status_unsuccessful:
  stage: production_set_status
  script:
    - gitlab_update_issue failure
  extends:
    - .on_failure_status
  needs:
    - job: staging_status_successful
    - job: 1p_register_lister
    - job: 2p_check_listed_origins
    - job: 3p_schedule_first_visits
    - job: 4p_check_ingested_origins
